services:
  - type: web
    name: student-portal
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /login.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: student_portal
      - key: DB_PORT
        value: 3306
      - key: MONGODB_URI
        sync: false
